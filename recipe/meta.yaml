{% set name = "amplitude-analytics" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/amplitude_analytics-{{ version }}.tar.gz
  sha256: 47e685b5b49c95997cae059f7277b4792dbefe11c170e165d67c6a3f785b8e98

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - amplitude
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/amplitude/Amplitude-Python
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: The official Amplitude backend Python SDK for server-side instrumentation.
  dev_url: https://github.com/amplitude/Amplitude-Python

extra:
  recipe-maintainers:
    - josham
    - killua156
